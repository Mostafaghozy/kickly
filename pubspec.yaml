name: kickly
description: "kickly"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1
  dropdown_button2: ^2.3.9
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  gap: ^3.0.1

dev_dependencies:
  dio: ^5.11.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.5.5

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/onboarding/
    - assets/splash/
    - assets/appbar/
    - assets/home/
    - assets/auth/
    - assets/profile/

  fonts:
    - family: Mulish
      fonts:
        - asset: font/Mulish-Bold.ttf
        - asset: font/Mulish-Regular.ttf
        - asset: font/Mulish-SemiBold.ttf
        - asset: font/Mulish-ExtraBold.ttf
